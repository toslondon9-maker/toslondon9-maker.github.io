<title id="title">Weeks 11 to 24: Faith, application, concentration and contemplation</title><desc id="desc">The final fourteen parts move through faith, unity, observation, harmony, insight, happiness, concentration, creative thought, the Silence, Truth, prayer, service and discernment.</desc>
<rect width="1200" height="590" rx="30" fill="#f7f3ea"/><text x="60" y="76" font-family="Georgia,serif" font-size="35" fill="#17283d">Weeks 11–24: from faith to discernment</text>
<g font-family="Arial,sans-serif">
<rect x="65" y="125" width="500" height="365" rx="22" fill="#17283d"/><text x="100" y="180" fill="#d6b46b" font-size="18" letter-spacing="2">WEEKS 11–16</text><text x="100" y="226" fill="#fffaf0" font-size="28" font-weight="700">Faith and application</text>
<g fill="#f7f3ea" font-size="19"><text x="105" y="285">11  Faith and desire</text><text x="105" y="326">12  Unity with the Universal</text><text x="105" y="367">13  The part and the whole</text><text x="105" y="408">14  Harmony</text><text x="105" y="449">15  Insight</text><text x="105" y="480">16  Happiness and harmony</text></g>
<rect x="635" y="125" width="500" height="365" rx="22" fill="#203852"/><text x="670" y="180" fill="#d6b46b" font-size="18" letter-spacing="2">WEEKS 17–24</text><text x="670" y="226" fill="#fffaf0" font-size="28" font-weight="700">Concentration and contemplation</text>
<g fill="#f7f3ea" font-size="19"><text x="675" y="285">17  Concentration without strain</text><text x="675" y="326">18  The power to create</text><text x="675" y="367">19  Appearance and sustained thought</text><text x="675" y="408">20  The Silence and spiritual unity</text><text x="675" y="449">21  Truth</text><text x="675" y="480">22–24  Prayer, service and discernment</text></g>
</g><text x="60" y="540" font-family="Arial,sans-serif" font-size="16" fill="#6d6a62">UYP study diagram. Grouping is an editorial summary; the 24 parts remain Haanel’s sequence.</text></svg>