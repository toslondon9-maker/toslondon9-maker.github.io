<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Weeks 1 to 4: Foundation exercises</title><desc id="desc">The first four weekly exercises: physical stillness, inhibiting thought, relaxing the body, and mentally releasing adverse conditions.</desc>
<rect width="1200" height="440" rx="30" fill="#f7f3ea"/><text x="60" y="76" font-family="Georgia,serif" font-size="34" fill="#17283d">The foundation: four progressive exercises</text>
<g font-family="Arial,sans-serif"><g><circle cx="160" cy="185" r="55" fill="#17283d"/><text x="160" y="196" text-anchor="middle" font-size="30" fill="#d6b46b">01</text><text x="160" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#17283d">Stillness</text><text x="160" y="316" text-anchor="middle" font-size="17" fill="#575c61">Keep the body still</text><text x="160" y="343" text-anchor="middle" font-size="17" fill="#575c61">for 15–30 minutes</text></g>
<path d="M240 185h65m-14 -12l14 12 -14 12" stroke="#b28a45" stroke-width="5" fill="none"/>
<g><circle cx="420" cy="185" r="55" fill="#203852"/><text x="420" y="196" text-anchor="middle" font-size="30" fill="#d6b46b">02</text><text x="420" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#17283d">Inhibit thought</text><text x="420" y="316" text-anchor="middle" font-size="17" fill="#575c61">Remain still; practise</text><text x="420" y="343" text-anchor="middle" font-size="17" fill="#575c61">quieting thought</text></g>
<path d="M500 185h65m-14 -12l14 12 -14 12" stroke="#b28a45" stroke-width="5" fill="none"/>
<g><circle cx="680" cy="185" r="55" fill="#29435b"/><text x="680" y="196" text-anchor="middle" font-size="30" fill="#d6b46b">03</text><text x="680" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#17283d">Relax</text><text x="680" y="316" text-anchor="middle" font-size="17" fill="#575c61">Release muscular</text><text x="680" y="343" text-anchor="middle" font-size="17" fill="#575c61">and nervous tension</text></g>
<path d="M760 185h65m-14 -12l14 12 -14 12" stroke="#b28a45" stroke-width="5" fill="none"/>
<g><circle cx="940" cy="185" r="55" fill="#b28a45"/><text x="940" y="196" text-anchor="middle" font-size="30" fill="#17283d">04</text><text x="940" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#17283d">Mental release</text><text x="940" y="316" text-anchor="middle" font-size="17" fill="#575c61">Let go of adverse</text><text x="940" y="343" text-anchor="middle" font-size="17" fill="#575c61">thoughts deliberately</text></g></g>
<text x="60" y="400" font-family="Arial,sans-serif" font-size="16" fill="#6d6a62">UYP study diagram. The wording is a concise paraphrase of Parts One to Four.</text></svg>