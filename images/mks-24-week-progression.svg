<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">The 24-week Master Key System progression</title><desc id="desc">Four connected stages: Foundation, Visualisation, Faith and application, and Concentration and contemplation.</desc>
<rect width="1200" height="620" rx="34" fill="#f7f3ea"/><text x="70" y="86" fill="#17283d" font-family="Georgia,serif" font-size="38">The 24-week study journey</text><text x="70" y="126" fill="#6d6a62" font-family="Arial,sans-serif" font-size="19">A modern UYP study aid following Haanel’s original sequence</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="190" width="240" height="300" rx="22" fill="#17283d"/><text x="100" y="245" fill="#d6b46b" font-size="17" letter-spacing="2">WEEKS 1–4</text><text x="100" y="295" fill="#fffaf0" font-size="28" font-weight="700">Foundation</text><text x="100" y="350" fill="#f7f3ea" font-size="18">Stillness</text><text x="100" y="382" fill="#f7f3ea" font-size="18">Thought control</text><text x="100" y="414" fill="#f7f3ea" font-size="18">Relaxation</text><text x="100" y="446" fill="#f7f3ea" font-size="18">Mental release</text>
<path d="M320 340h38l-12 -12m12 12l-12 12" fill="none" stroke="#b28a45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="370" y="190" width="240" height="300" rx="22" fill="#203852"/><text x="400" y="245" fill="#d6b46b" font-size="17" letter-spacing="2">WEEKS 5–10</text><text x="400" y="295" fill="#fffaf0" font-size="28" font-weight="700">Visualisation</text><text x="400" y="350" fill="#f7f3ea" font-size="18">Place &amp; photograph</text><text x="400" y="382" fill="#f7f3ea" font-size="18">Friend &amp; battleship</text><text x="400" y="414" fill="#f7f3ea" font-size="18">Plant &amp; geometric form</text>
<path d="M620 340h38l-12 -12m12 12l-12 12" fill="none" stroke="#b28a45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="670" y="190" width="240" height="300" rx="22" fill="#29435b"/><text x="700" y="245" fill="#d6b46b" font-size="17" letter-spacing="2">WEEKS 11–16</text><text x="700" y="295" fill="#fffaf0" font-size="28" font-weight="700">Application</text><text x="700" y="350" fill="#f7f3ea" font-size="18">Faith &amp; unity</text><text x="700" y="382" fill="#f7f3ea" font-size="18">Observation</text><text x="700" y="414" fill="#f7f3ea" font-size="18">Harmony &amp; insight</text><text x="700" y="446" fill="#f7f3ea" font-size="18">Happiness</text>
<path d="M920 340h38l-12 -12m12 12l-12 12" fill="none" stroke="#b28a45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="970" y="190" width="160" height="300" rx="22" fill="#b28a45"/><text x="995" y="245" fill="#17283d" font-size="17" letter-spacing="2">WEEKS 17–24</text><text x="995" y="295" fill="#17283d" font-size="24" font-weight="700">Contem-</text><text x="995" y="324" fill="#17283d" font-size="24" font-weight="700">plation</text><text x="995" y="382" fill="#17283d" font-size="17">Repose</text><text x="995" y="412" fill="#17283d" font-size="17">The Silence</text><text x="995" y="442" fill="#17283d" font-size="17">Truth &amp; service</text>
</g><text x="70" y="555" fill="#6d6a62" font-family="Arial,sans-serif" font-size="17">The stages are a study summary, not headings supplied by Haanel.</text></svg>