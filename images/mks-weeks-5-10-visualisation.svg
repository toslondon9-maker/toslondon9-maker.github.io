<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Weeks 5 to 10: Visualisation exercises</title><desc id="desc">Six visualisation exercises in order: familiar place, photograph, friend, battleship, flower and geometric shape.</desc>
<rect width="1200" height="560" rx="30" fill="#f7f3ea"/><text x="60" y="78" font-family="Georgia,serif" font-size="35" fill="#17283d">Visualisation: the exact sequence in Parts Five to Ten</text>
<g font-family="Arial,sans-serif" fill="#17283d">
<g transform="translate(70 145)"><rect width="320" height="130" rx="18" fill="#17283d"/><text x="24" y="38" fill="#d6b46b" font-size="16" letter-spacing="1">WEEK 5</text><text x="24" y="78" fill="#fffaf0" font-size="25" font-weight="700">A familiar place</text><text x="24" y="108" fill="#f7f3ea" font-size="16">Buildings, grounds, trees, people</text></g>
<g transform="translate(440 145)"><rect width="320" height="130" rx="18" fill="#203852"/><text x="24" y="38" fill="#d6b46b" font-size="16" letter-spacing="1">WEEK 6</text><text x="24" y="78" fill="#fffaf0" font-size="25" font-weight="700">A photograph</text><text x="24" y="108" fill="#f7f3ea" font-size="16">Observe, cover, recall details</text></g>
<g transform="translate(810 145)"><rect width="320" height="130" rx="18" fill="#29435b"/><text x="24" y="38" fill="#d6b46b" font-size="16" letter-spacing="1">WEEK 7</text><text x="24" y="78" fill="#fffaf0" font-size="25" font-weight="700">A friend</text><text x="24" y="108" fill="#f7f3ea" font-size="16">Rebuild a remembered encounter</text></g>
<g transform="translate(70 315)"><rect width="320" height="130" rx="18" fill="#29435b"/><text x="24" y="38" fill="#d6b46b" font-size="16" letter-spacing="1">WEEK 8</text><text x="24" y="78" fill="#fffaf0" font-size="25" font-weight="700">A battleship</text><text x="24" y="108" fill="#f7f3ea" font-size="16">Trace the object back to its causes</text></g>
<g transform="translate(440 315)"><rect width="320" height="130" rx="18" fill="#203852"/><text x="24" y="38" fill="#d6b46b" font-size="16" letter-spacing="1">WEEK 9</text><text x="24" y="78" fill="#fffaf0" font-size="25" font-weight="700">A flower</text><text x="24" y="108" fill="#f7f3ea" font-size="16">Follow seed to fully opened bloom</text></g>
<g transform="translate(810 315)"><rect width="320" height="130" rx="18" fill="#b28a45"/><text x="24" y="38" fill="#17283d" font-size="16" letter-spacing="1">WEEK 10</text><text x="24" y="78" fill="#17283d" font-size="25" font-weight="700">A geometric form</text><text x="24" y="108" fill="#17283d" font-size="16">Line → square → circle → cone</text></g></g>
<text x="60" y="510" font-family="Arial,sans-serif" font-size="16" fill="#6d6a62">UYP study diagram. These are Haanel’s exercises, summarised in the original order.</text></svg>