name: Build, test and deploy Unleash Your Power

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.mjs"
      - "**/*.html"
      - "content/**"
      - "src/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static pages for validation
        run: node tools/build-site.mjs --write-public

      - name: Run full automated test suite
        run: node --test tests/*.test.mjs

      - name: Verify deterministic production build
        run: node tools/build-site.mjs --check

      - name: Build static preview
        run: node tools/build-site.mjs

  deploy:
    name: Build and deploy GitHub Pages artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static pages
        run: node tools/build-site.mjs --write-public

      - name: Run full automated test suite
        run: node --test tests/*.test.mjs

      - name: Verify deterministic production build
        run: node tools/build-site.mjs --check

      - name: Build clean production output
        run: |
          node tools/build-site.mjs
          mkdir -p dist
          cp -a .build-preview/. dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
